<!doctype html>
<!--
  Source of the staging icons beside this file: the stable icon with an
  amber STAGING band along the bottom, so the two installs tell apart on a
  home screen at a glance — a label nobody can read at 48px still reads as
  "the one with the stripe". The band sits under the castle's base, inside
  the circle a maskable icon is cropped to, so the mask takes only its
  corners.

  Baked by `pnpm icons` (../render.ts). The band is composited over
  ../stable/icon.svg rather than over a baked PNG of it, so a 180px staging
  icon rasterises the drawing at 180 instead of shrinking the 512 — and so
  there is no order to get wrong between the two channels.

  The box takes its edge from --edge, which the renderer sets once per
  size; opened in a browser on its own it falls back to filling the
  viewport. Everything inside is sized against that box in cqw rather than
  against the window in vw — the renderer draws a 180px icon in a 512px
  window, and vw would set the band's type for the window.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        font-weight: 400 600;
        src: url('../../../public/fonts/space-grotesk-latin.woff2')
          format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .icon {
        position: relative;
        container-type: size;
        width: var(--edge, 100vw);
        height: var(--edge, 100vw);
        background: url('../stable/icon.svg') center / 100% 100% no-repeat;
      }
      .band {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 17%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e0a92e;
        box-shadow: 0 -1.2cqw 0 rgba(20, 30, 20, 0.35);
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 9.5cqw;
        letter-spacing: 0.16em;
        text-indent: 0.16em;
        color: #2a2205;
      }
    </style>
  </head>
  <body>
    <div class="icon"><div class="band">STAGING</div></div>
  </body>
</html>
