    <path d="M166 282 L256 328 L256 218 L166 172 Z" fill="#f2e8d3"/>
    <path d="M256 328 L346 282 L346 172 L256 218 Z" fill="#c3b294"/>

    <!-- pyramid roof -->
    <path d="M256 80 L166 172 L256 218 Z" fill="#41803c"/>
    <path d="M256 80 L346 172 L256 218 Z" fill="#2c552c"/>

    <!-- pennant -->
    <rect x="252" y="52" width="8" height="34" rx="3" fill="#4a3220"/>
    <path d="M260 56 L302 68 L260 80 Z" fill="#e5c469"/>

    <!-- door and lit windows -->
    <path d="M200 288 L228 302 L228 258 A16 16 0 0 0 200 244 Z" fill="#4a3220"/>
    <path d="M198 214 L220 225 L220 199 L198 188 Z" fill="#e5c469"/>
    <path d="M292 225 L314 214 L314 188 L292 199 Z" fill="#c9a24f"/>
