<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>D — Isometric keep</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="34%" r="76%">
      <stop offset="0" stop-color="#3a5a3d"/>
      <stop offset="1" stop-color="#1a2a1e"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <g transform="translate(0 16)">
    <!-- ground tile -->
    <path d="M256 228 L416 300 L256 372 L96 300 Z" fill="#4d8f28"/>
    <path d="M256 372 L416 300 L416 312 L256 384 L96 312 L96 300 Z" fill="#2f5c1c"/>

