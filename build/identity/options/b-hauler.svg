<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>B — The hauler</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="36%" r="76%">
      <stop offset="0" stop-color="#3a5a3d"/>
      <stop offset="1" stop-color="#1a2a1e"/>
    </radialGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eccd80"/>
      <stop offset="1" stop-color="#c69736"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- the lane a thousand crossings wears into the grass -->
  <ellipse cx="256" cy="392" rx="152" ry="22" fill="#9b7d4e" opacity="0.22"/>
  <ellipse cx="256" cy="393" rx="86" ry="13" fill="#0d160f" opacity="0.42"/>

  <g transform="translate(256 288) scale(1.12) translate(-256 -288)">
    <g stroke="#f2e8d3" fill="none" stroke-linecap="round">
      <!-- legs, mid-stride -->
      <path d="M252 318 L216 388" stroke-width="26"/>
      <path d="M252 318 L294 382" stroke-width="26"/>
      <!-- torso -->
      <path d="M250 254 L253 322" stroke-width="42"/>
    </g>

    <!-- the plank across the shoulders -->
    <g transform="rotate(-8 256 243)">
      <rect x="132" y="228" width="248" height="30" rx="7" fill="url(#plank)"/>
      <rect x="132" y="228" width="248" height="9" rx="4" fill="#f4e3ab" opacity="0.6"/>
    </g>

    <!-- arms up to the ends of it -->
    <g stroke="#f2e8d3" fill="none" stroke-linecap="round" stroke-width="19">
      <path d="M236 272 L204 252"/>
      <path d="M270 270 L308 246"/>
    </g>

    <circle cx="250" cy="206" r="29" fill="#f2e8d3"/>
  </g>
</svg>
