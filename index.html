<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the HUD reach under notches (it pads itself
         back out with env(safe-area-inset-*)); the scale locks stop a
         two-finger map pinch from zooming the page instead. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#223526" />
    <!-- iOS has no manifest support worth the name: these two give the same
         add-to-home-screen fullscreen treatment on Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Serf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e1210;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      /* Fixed to the viewport so the game always fills the window, even
         when body layout lags an emulated/embedded viewport change. */
      #canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        /* The map owns its gestures: no browser scroll, pull-to-refresh,
           or double-tap zoom over the world. */
        touch-action: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none; /* children opt back in */
        user-select: none;
      }
      /* Atmosphere pass: color grade over the 3D view, under the UI — a
         light warm daylight polish: sunny stylized RTS. */
      #grade-mult,
      #grade-soft,
      #grade-glow,
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #grade-mult {
        mix-blend-mode: multiply;
        background: linear-gradient(155deg, rgba(180, 195, 150, 0.1) 0%, rgba(95, 130, 125, 0.16) 100%);
      }
      #grade-soft {
        mix-blend-mode: soft-light;
        background: linear-gradient(200deg, rgba(255, 224, 156, 0.5) 0%, rgba(110, 150, 165, 0.3) 85%);
      }
      #grade-glow {
        mix-blend-mode: overlay;
        background: radial-gradient(ellipse 62% 52% at 52% 40%, rgba(255, 234, 175, 0.32), transparent 70%);
      }
      #vignette {
        background: radial-gradient(
          ellipse 80% 72% at 50% 44%,
          transparent 62%,
          rgba(10, 18, 12, 0.3) 100%
        );
      }
      /* Pre-boot start screen (src/ui/StartMenu.tsx). Above #ui, and unlike
         #ui it takes pointer events; hidden until mounted. */
      #menu {
        position: fixed;
        inset: 0;
        display: none;
        z-index: 10;
      }
      /* While the menu is up the canvas is scenery: the real game framed on
         the castle, pushed back behind the glass. The grade layers keep
         applying, so it reads exactly like the game does. */
      html.menu-bg #canvas {
        filter: blur(3px) saturate(0.9) brightness(0.62);
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        color: #eddfb6;
        background: #0e1210;
        text-align: center;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="grade-mult"></div>
    <div id="grade-soft"></div>
    <div id="grade-glow"></div>
    <div id="vignette"></div>
    <div id="ui"></div>
    <div id="menu"></div>
    <div id="fatal"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
