<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- The theme switch (see src/render/medieval.ts) is repeated here because
         the base font must be right before any module runs: medieval is the
         default, so the Japanese faces load only for ?theme=japan and html.jp
         puts them back as the base font — no swap, no FOUC either way. -->
    <script>
      if (new URLSearchParams(location.search).get('theme') === 'japan') {
        document.documentElement.classList.add('jp');
        document.head.insertAdjacentHTML(
          'beforeend',
          '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Shippori+Mincho:wght@500;600;700&display=swap">',
        );
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #120d08;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      html.jp body {
        font-family: 'Zen Antique', Georgia, serif;
      }
      /* Fixed to the viewport so the game always fills the window, even
         when body layout lags an emulated/embedded viewport change. */
      #canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none; /* children opt back in */
        user-select: none;
      }
      /* Atmosphere pass: color grade over the 3D view, under the UI.
         Warm highlights, teal-green shadows — Battle-Realms-style grading. */
      #grade-mult,
      #grade-soft,
      #grade-glow,
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #grade-mult {
        mix-blend-mode: multiply;
        background: linear-gradient(155deg, rgba(90, 120, 70, 0.28) 0%, rgba(18, 46, 52, 0.55) 100%);
      }
      #grade-soft {
        mix-blend-mode: soft-light;
        background: linear-gradient(200deg, rgba(255, 190, 110, 0.55) 0%, rgba(10, 30, 40, 0.75) 85%);
      }
      #grade-glow {
        mix-blend-mode: overlay;
        background: radial-gradient(ellipse 60% 50% at 52% 40%, rgba(255, 214, 150, 0.3), transparent 70%);
      }
      #vignette {
        background: radial-gradient(
          ellipse 75% 68% at 50% 44%,
          transparent 46%,
          rgba(4, 8, 4, 0.62) 100%
        );
      }
      /* Daylight grade (html.day, set for the medieval theme): the gloom
         stack above is swapped for a light warm polish — sunny stylized
         RTS, not midnight forest. */
      html.day body {
        background: #0e1210;
      }
      html.day #grade-mult {
        background: linear-gradient(155deg, rgba(180, 195, 150, 0.1) 0%, rgba(95, 130, 125, 0.16) 100%);
      }
      html.day #grade-soft {
        background: linear-gradient(200deg, rgba(255, 224, 156, 0.5) 0%, rgba(110, 150, 165, 0.3) 85%);
      }
      html.day #grade-glow {
        background: radial-gradient(ellipse 62% 52% at 52% 40%, rgba(255, 234, 175, 0.32), transparent 70%);
      }
      html.day #vignette {
        background: radial-gradient(
          ellipse 80% 72% at 50% 44%,
          transparent 62%,
          rgba(10, 18, 12, 0.3) 100%
        );
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        color: #eddfb6;
        background: #120d08;
        text-align: center;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="grade-mult"></div>
    <div id="grade-soft"></div>
    <div id="grade-glow"></div>
    <div id="vignette"></div>
    <div id="ui"></div>
    <div id="fatal"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
